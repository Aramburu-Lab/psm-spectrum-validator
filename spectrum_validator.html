<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PSM Spectrum Validator</title>
<meta id="release" name="release" content="2026-10-30" data-build="be7cc8d9">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one bench. Settings across the top, the spectrum list on the left, one large annotated
   spectrum on the right, and the flowchart's questions sliding underneath it one card at a time.
   Tokens follow settings/run_report.css so the tool reads as part of the same report family. */
:root{
  --bg:#FCFCFD;--surface:#FFFFFF;--surface-2:#F4F6F8;--ink:#181B1F;--muted:#5B6168;--faint:#8A9098;
  --line:#E4E7EB;--line-strong:#D2D7DD;
  --b:#0072B2;--y:#E69F00;--y-ink:#8F5300;--ion-other:#009E73;--other-ink:#047857;--unexpl:#D55E00;--unexpl-ink:#B93A0E;--below:#CDD2D8;
  --b-hi:#0072B2;--y-hi:#E69F00;--other-hi:#009E73;--unexpl-hi:#D55E00;
  --sel:#CC79A7;--sel-ink:#A23B78;--model:#181B1F;--model-ink:#181B1F;
  --ok:#047857;--ok-fill:#E2F3EC;--good:#0072B2;--good-fill:#E5F0F8;--contam:#285C8F;--contam-fill:#DCE7F2;
  --close:#9A5806;--close-fill:#FCEFD9;--fp:#B93A0E;--fp-fill:#FBE3DA;--half:#C99A06;--half-fill:#FFF5CC;--half-ink:#735600;--low:#5B6168;--low-fill:#ECEEF1;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 10px 28px -16px rgba(16,24,40,.25);
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;--glow:#B8860B;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101316;--surface:#1A1E22;--surface-2:#22272D;--ink:#E7E9EC;--muted:#9BA2AA;--faint:#727A83;
  --line:#2A2F36;--line-strong:#3A4047;
  --b:#56B4E9;--y:#E69F00;--y-ink:#F0B45E;--ion-other:#34D399;--other-ink:#5BD6A6;--unexpl:#FF8A65;--unexpl-ink:#FF8A65;--below:#3A4047;
  --b-hi:#8FD3FA;--y-hi:#FFC247;--other-hi:#6EE7B7;--unexpl-hi:#FFAB91;--glow:#F0E442;
  --sel:#E08BBB;--sel-ink:#F2A7CF;--model:#E7E9EC;--model-ink:#E7E9EC;
  --ok:#5BD6A6;--ok-fill:#13261F;--good:#7CC4F0;--good-fill:#132433;--contam:#9DBCE0;--contam-fill:#18222E;
  --close:#F0B45E;--close-fill:#2B2214;--fp:#FF8A65;--fp-fill:#2E1A14;--half:#E8C547;--half-fill:#2B2510;--half-ink:#F2D36B;--low:#9BA2AA;--low-fill:#22272D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101316;--surface:#1A1E22;--surface-2:#22272D;--ink:#E7E9EC;--muted:#9BA2AA;--faint:#727A83;
  --line:#2A2F36;--line-strong:#3A4047;
  --b:#56B4E9;--y:#E69F00;--y-ink:#F0B45E;--ion-other:#34D399;--other-ink:#5BD6A6;--unexpl:#FF8A65;--unexpl-ink:#FF8A65;--below:#3A4047;
  --b-hi:#8FD3FA;--y-hi:#FFC247;--other-hi:#6EE7B7;--unexpl-hi:#FFAB91;--glow:#F0E442;
  --sel:#E08BBB;--sel-ink:#F2A7CF;--model:#E7E9EC;--model-ink:#E7E9EC;
  --ok:#5BD6A6;--ok-fill:#13261F;--good:#7CC4F0;--good-fill:#132433;--contam:#9DBCE0;--contam-fill:#18222E;
  --close:#F0B45E;--close-fill:#2B2214;--fp:#FF8A65;--fp-fill:#2E1A14;--half:#E8C547;--half-fill:#2B2510;--half-ink:#F2D36B;--low:#9BA2AA;--low-fill:#22272D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* The page opens at 150%, the size Rytis reads it at (2026-10-29): text, controls and the spectrum scale
   together, as with browser zoom, which still multiplies on top. CSS zoom leaves media queries and vh
   counting window pixels, so the breakpoints below count the page's own pixels instead, and fall where
   they would at 150% browser zoom, to within a scrollbar's width where the scrollbar is always shown. The
   containment that lets html be the query container stops body's background reaching the window's edges,
   so html carries it too. */
:root{--page-zoom:1.5}
html{zoom:var(--page-zoom);container-type:inline-size;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:1360px;margin:0 auto;padding-block:8px 40px}
/* Text runs to the edge of its box and breaks only where it must, as Rytis asked twice: no balanced
   headings and no width caps on text anywhere on the page. */
h1,h2{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;
  padding-block:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:flex-start;min-width:0;flex:1 1 320px}
.mark{flex:none;width:30px;height:30px;margin-top:3px}
.mark i{display:block;height:4px;border-radius:2px;margin-bottom:3px}
.mark i:nth-child(1){width:30px;background:var(--y)}.mark i:nth-child(2){width:14px;background:var(--b)}
.mark i:nth-child(3){width:22px;background:var(--y)}.mark i:nth-child(4){width:9px;background:var(--b)}
h1{font-size:21px;letter-spacing:-.01em;line-height:1.2}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
/* A control's parts each stay whole and wrap between them, so Settings fits a phone: on one line the base peak threshold
   ran past the window and scrolled the page sideways (2026-10-30 verification). The widest select may shrink, and still
   lists its options whole when opened. */
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.ctl output{font-family:var(--mono);color:var(--ink);font-size:12.5px;min-width:3.4em;text-align:right;
  font-variant-numeric:tabular-nums}
.ctl input[type=range]{width:130px;accent-color:var(--b)}
.ctl input[type=number]{width:62px;padding:4px 6px;border:1px solid var(--line-strong);border-radius:7px;
  background:var(--surface);font-family:var(--mono);font-size:12.5px}
.ctl select{padding:4px 4px;border:1px solid var(--line-strong);border-radius:7px;background:var(--surface);font-size:12.5px;min-width:0}
/* Every pill's ends are as round as one line is tall: half a line and the padding and border above it, which is what
   999px gives on one line. On a label that wraps, 999px rounds by half the whole box, and the 2026-10-30 verification
   found a statement wrapped to five lines at a phone's width with its first and last lines across the corners. */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);
  border-radius:calc(.5lh + 7px);padding:6px 14px;font-size:13.5px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:disabled{opacity:.35;cursor:not-allowed}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.small{padding:4px 11px;font-size:12.5px}
.file input{position:absolute;width:1px;height:1px;opacity:0}
.file{position:relative}
.file:focus-within{outline:2px solid var(--b);outline-offset:2px}
.banner{margin:12px 0 0;font-size:13px;color:var(--muted)}
.banner:empty{display:none}
.banner b{color:var(--ink)}
.banner.warn{color:var(--fp)}

.bench{display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;padding-block:14px}
@container (max-width:860px){.bench{grid-template-columns:minmax(0,1fr)}.bench .list ol{max-height:190px}}
.list{min-width:0}
.list-head{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:700;
  margin-bottom:6px}
.list ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:calc(72vh / var(--page-zoom));overflow:auto}
.list button{width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:9px;
  padding:7px 9px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:1px 8px;align-items:baseline}
.list button:hover{background:var(--surface-2)}
.list button.cur{background:var(--surface);border-color:var(--line-strong);box-shadow:var(--shadow)}
.list .n{font-family:var(--mono);font-size:11.5px;color:var(--faint);grid-row:span 2}
.list .pep{font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .st{font-size:11.5px;color:var(--muted)}
.list .st .chip{font-size:11px}

.work{min-width:0;display:flex;flex-direction:column;gap:12px}
.spec-head{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
.spec-head .seq{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:.02em;overflow-wrap:anywhere}
.spec-head .z{font-family:var(--mono);color:var(--muted);font-size:15px}
.spec-head .meta{flex-basis:100%;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.spec-head .meta .bad{color:var(--fp);font-weight:600}
.spec-head .meta .okk{color:var(--ok)}
.spec-head .meta .caution{color:var(--close);font-weight:600}
.caution{margin:0;font-size:13.5px;color:var(--close);font-weight:600}
.plotwrap{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:6px 4px 2px}
/* The plot stays in view while the questions scroll under it, so pointing at an ion in a list shows
   where it is; on a screen under 760 page pixels tall it scrolls away rather than take most of the height.
   The offset makes that test, as a media query would count window pixels: under that height it is so far
   negative that the plot never sticks. */
.plotwrap{position:sticky;z-index:3;top:min(0px, (100vh - 760px * var(--page-zoom)) * 1000)}
#plot{display:block;width:100%;height:auto;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#plot.selecting{cursor:crosshair}
/* A wide, unseen stroke over each line, so it can be taken hold of; touch drags it rather than scrolling. */
.grab{stroke:transparent;stroke-width:12px;pointer-events:stroke;cursor:ns-resize;touch-action:none}
/* Its own background, so a readout over the sequence's hook numbers stays legible. */
.readout{position:absolute;right:12px;top:8px;font-family:var(--mono);font-size:11.5px;color:var(--muted);
  pointer-events:none;font-variant-numeric:tabular-nums;background:var(--surface);padding:0 5px;border-radius:5px}
.readout:empty{display:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px}
.legend .hint{margin-left:auto;color:var(--faint)}
/* Each legend entry shows or hides its part of the figure; a hidden one is greyed and struck through. */
.legend .lg{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:2px 5px;border-radius:6px;font-size:12px;color:var(--muted)}
.legend .lg:hover{background:var(--surface-2);color:var(--ink)}
.legend .lg[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.setgloss{margin-top:12px}
.lgq{display:inline-flex;align-items:center;gap:1px}
.legend .dot{display:inline-block;border-radius:50%}
.errbox{padding:22px;border:1px dashed var(--line-strong);border-radius:var(--r);color:var(--muted)}

/* plot marks, coloured through tokens so both themes work */
.ax{stroke:var(--line-strong)}.grid{stroke:var(--line)}
.axt{fill:var(--muted);font-family:var(--sans)}
.axn{fill:var(--faint);font-family:var(--mono)}
.pk{stroke-width:1.4}
.pk.b{stroke:var(--b)}.pk.y{stroke:var(--y)}.pk.other{stroke:var(--ion-other)}
.pk.none{stroke:var(--unexpl)}.pk.below{stroke:var(--below)}.pk.iso{opacity:.55}
.pk.sel{stroke:var(--sel);stroke-width:3}
/* A peak at or above the prominent line, its hook and its letter are lit: a lifted shade of the series
   colour over a soft underlay of it, plain vector marks that the saved figure keeps. */
.pk.prom{stroke-width:2.2}.pk.prom.b{stroke:var(--b-hi)}.pk.prom.y{stroke:var(--y-hi)}.pk.prom.other{stroke:var(--other-hi)}.pk.prom.none{stroke:var(--unexpl-hi)}
.pkglow{stroke-width:6;stroke-opacity:.2;stroke-linecap:round;pointer-events:none}
.pkglow.b{stroke:var(--b-hi)}.pkglow.y{stroke:var(--y-hi)}.pkglow.other{stroke:var(--other-hi)}.pkglow.none{stroke:var(--unexpl-hi)}
.pk.iso.lit{opacity:1}.pk.iso.dim{opacity:.5}
.cap{fill:var(--sel)}
.lab{font-family:var(--sans);font-weight:600}
.lab.b{fill:var(--b)}.lab.y{fill:var(--y-ink)}.lab.other{fill:var(--other-ink)}.lab.none{fill:var(--unexpl-ink)}
.thr{stroke:var(--muted);stroke-width:1.4;stroke-dasharray:6 4}.promline{stroke:var(--ink);stroke-opacity:.75;stroke-width:1.6;stroke-dasharray:2 3}
.thrt{fill:var(--ink);font-weight:650;font-family:var(--sans);paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.rsel{fill:var(--sel);fill-opacity:.14;stroke:var(--sel);stroke-opacity:.6}
.rmod{fill:var(--model);fill-opacity:.09;stroke:var(--model);stroke-dasharray:5 3}
.ring{fill:none;stroke:var(--model);stroke-width:2;stroke-dasharray:4 2}
.pinbg{fill:var(--model)}.pint{fill:var(--bg);font-weight:700;font-family:var(--sans)}.pinlead{stroke:var(--model);stroke-width:1.2}
.rub{fill:var(--sel);fill-opacity:.10;stroke:var(--sel);stroke-dasharray:3 3}
.rub.zoom{fill:var(--faint);stroke:var(--faint)}
.lad{font-family:var(--mono);font-weight:600;fill:var(--ink)}
.moddot{fill:var(--muted)}
.ladsel{fill:var(--sel);fill-opacity:.24}
/* A marked ion that does not count toward coverage, a loss or an a ion, outlines its half rather than filling it. */
.ladout{fill:none;stroke:var(--sel-ink);stroke-width:1.2;stroke-dasharray:2 1.5}
.rpulse{fill:none;stroke:var(--ink);stroke-width:1.4;animation:rpulse 1.1s ease-in-out infinite;pointer-events:none}
@keyframes rpulse{0%,100%{opacity:.15}50%{opacity:.8}}
/* A gap pointer's letters stay outlined while its card is shown, and fill as its line in the reply is pointed at. */
.evline{fill:none;stroke:var(--model);stroke-width:1.2;stroke-opacity:.75;stroke-dasharray:3 2;pointer-events:none}
.opt.let{font-family:var(--mono);padding:3px 8px;font-size:12.5px}
.hook{fill:none;stroke-width:1.6}.hook.b{stroke:var(--b)}.hook.y{stroke:var(--y)}
.hook.prom{stroke-width:2}.hook.prom.b{stroke:var(--b-hi)}.hook.prom.y{stroke:var(--y-hi)}
.hookglow{fill:none;stroke-width:5;stroke-opacity:.22;stroke-linecap:round}.hookglow.b{stroke:var(--b-hi)}.hookglow.y{stroke:var(--y-hi)}
.promres{fill-opacity:.2}.promres.b{fill:var(--b-hi)}.promres.y{fill:var(--y-hi)}
.hook.mark{stroke:var(--sel);stroke-width:3}.hook.mark.unseen{stroke-dasharray:2.5 2}
/* A bond's missing ions, dashed red across the letters' box as the hooks sit: the upper half where no y ion breaks it,
   the lower half where no b ion does. The ladder sets each half's dashes, as they follow the letters' size. A lit half
   glows behind it, cut flat at both ends so that it lights its own half alone. The line is three times its first 1.2,
   as Rytis asked on 2026-10-29, and GAP_LINE carries it to the letters; its glow widened by as much, so the same 2.9
   shows each side of it. */
.gap{fill:none;stroke:var(--fp);stroke-width:3.6}
.halo.gapglow{stroke-width:9.4;stroke-linecap:butt}
/* The legend's swatches, 16 px standing for the letters' box, two dashes to a half and each half opening and closing on
   half a gap, as on the ladder. */
.gapkey{flex:none;width:6px;height:16px}.gapkey .gap{stroke-dasharray:0 .8 2.4 .8}
.flash{animation:flash .5s ease-in-out 3}
@keyframes flash{50%{opacity:.15}}

.deck{display:flex;flex-direction:column;gap:10px}
.path{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.path button{border:1px solid var(--line-strong);background:var(--surface);border-radius:calc(.5lh + 4px);padding:3px 10px;
  font-size:12px;color:var(--muted)}
.path button.cur{border-color:var(--ink);color:var(--ink);font-weight:600}
.path b{font-weight:700;color:var(--ink)}
/* The cards slide by the track's transform alone, so the viewport is clipped and never scrolls: a hidden box still
   scrolls to show what is focused or centred past its edge, which pushed a phone's card sideways in the 2026-10-29
   verification. hidden stays for a browser without clip. */
.viewport{overflow:hidden;overflow:clip;border-radius:var(--r);transition:height .25s ease}
.track{display:flex;align-items:flex-start;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.card{flex:0 0 100%;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;display:flex;flex-direction:column;gap:12px}
/* A card's buttons wrap rather than run past the card, whose viewport clips. */
.card .btn{white-space:normal}
/* The card's number stays whole, and the question's name goes below it where both do not fit a phone's card. */
.card-top{display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline;font-size:12px;color:var(--faint);
  letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.q{font-size:19px;line-height:1.3;font-weight:650}
/* Yes and No each take at most half a phone's card less half the gap, and stack only where their words do not fit. */
.answers{display:flex;flex-wrap:wrap;gap:10px}
.ans{min-width:min(84px,calc(50% - 5px));padding:8px 18px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface-2);
  font-weight:700;font-size:15px}
.ans.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.ans:disabled{cursor:default}
.ans:disabled:not(.on){opacity:.4}
.prompt{margin:0;padding:9px 12px;border-radius:9px;background:var(--surface-2);border-left:3px solid var(--sel);
  font-size:14px}
/* Plain text flow, not a flex row: the hint starts right after its button and wraps only at the card's
   edge. A flex row either drops it whole below the button or squeezes it into a narrow column. */
.because .btn{margin-right:10px}
.selcount{font-size:12.5px;color:var(--muted)}
.verdict{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.verdict.agree{background:var(--ok-fill);border:1px solid var(--ok)}
.verdict.half{background:var(--half-fill);border:1px solid var(--half)}
.verdict.differ{background:var(--fp-fill);border:1px solid var(--fp)}
.verdict .opinion{align-self:flex-start}
.tone{margin:0;font-size:13px;font-weight:650}
.brow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lead{font-weight:700;font-size:13.5px;padding:6px 13px;border-radius:calc(.5lh + 6px);background:var(--ink);color:var(--bg)}
.opt{border:1.5px solid var(--line-strong);background:var(--surface);border-radius:calc(.5lh + 7.5px);padding:6px 13px;font-size:13.5px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--faint)}
.opt:disabled{opacity:.45;cursor:not-allowed}
.opt.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt.grp.on{background:var(--sel-ink);border-color:var(--sel-ink);color:var(--bg)}
.said{margin:0;font-size:13.5px;color:var(--muted);font-style:italic}
.ctlrate{margin:0;font-size:13px;color:var(--muted)}
.hnum{font-family:var(--sans);font-weight:600}.hnum.b{fill:var(--b)}.hnum.y{fill:var(--y-ink)}.hnum.mark{fill:var(--sel-ink)}
.halo{stroke:var(--glow);stroke-width:9;stroke-linecap:round;animation:shine 1.1s ease-in-out infinite}
.rglow{fill:var(--glow);animation:shine 1.1s ease-in-out infinite}
.dim{opacity:.5}
@keyframes shine{0%,100%{opacity:.3}50%{opacity:.95}}
/* The red underline under a P after a lit K or R draws itself from left to right and starts again. It grows by a
   transform, which the saved figure does not carry, so the figure holds the line whole, as reduced motion shows it. */
.kpline{stroke:var(--fp);stroke-linecap:butt;transform-box:fill-box;transform-origin:left;animation:underline 1.5s linear infinite}
@keyframes underline{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pick-list{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto;padding:6px 8px;border:1px solid var(--line-strong);
  border-radius:10px;background:var(--surface)}
/* A peak's m/z and share go below its name where a phone's card has no room beside it, rather than past the card. */
.pick-list label{display:flex;flex-wrap:wrap;gap:0 8px;align-items:center;font-size:13.5px;padding:3px 2px;cursor:pointer}
.pick-list .iname,.iblock .iname{font-family:var(--mono);font-weight:700}
.iblock{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.iblock .ihead{display:flex;flex-wrap:wrap;gap:0 10px;align-items:baseline;font-size:13px;color:var(--muted)}
.who{margin:0;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
.say{margin:0;font-size:18px;font-weight:700}
.verdict.agree .say{color:var(--ok)}
.verdict.half .say,.verdict.half .tone{color:var(--half-ink)}
.verdict.differ .say,.verdict.differ .tone{color:var(--fp)}
.chip.t-agree{color:var(--ok);background:var(--ok-fill)}.chip.t-half{color:var(--half-ink);background:var(--half-fill)}
.chip.t-differ{color:var(--fp);background:var(--fp-fill)}
.pointers{display:flex;flex-direction:column;gap:8px}
.pgroup{display:flex;flex-direction:column;gap:1px}
.phead{margin:0;font-size:12.5px;font-weight:700;color:var(--muted)}
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
/* A column is as wide as the group's longest note, in characters of the list's own size, beside the pin and its
   gap. 1ch is a digit's width: in Helvetica Neue every note that flows on the examples' replies fills 79 to 91% of
   its count of them, so none wraps. */
.points.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,calc(var(--note) * 1ch + 26px)),1fr));column-gap:16px}
.points button{border:0;background:transparent;text-align:left;padding:3px 0;display:flex;gap:8px;align-items:baseline;width:100%}
.points button:hover{color:var(--model-ink)}
.pin{flex:none;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--model);
  color:var(--bg);font-size:11px;font-weight:700}
/* A pointer the plot has no room to pin shows its number hollow and dashed, as its ring is drawn. */
.nopin .pin{background:transparent;color:var(--model-ink);border:1.5px dashed var(--model)}
.model-why{margin:2px 0 0;font-size:13px;color:var(--muted)}
.model-why p,.model-why ol{margin:0}.model-why ol{padding-left:20px}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between}
/* A verdict too long for a phone's card breaks inside its longest word rather than run past the card. */
.outbox{align-self:flex-start;padding:12px 22px;border-radius:12px;border:2px solid;font-size:22px;font-weight:750;overflow-wrap:anywhere}
.o-excellent{color:var(--ok);background:var(--ok-fill);border-color:var(--ok)}
.o-good{color:var(--good);background:var(--good-fill);border-color:var(--good)}
.o-contam{color:var(--contam);background:var(--contam-fill);border-color:var(--contam)}
.o-close{color:var(--close);background:var(--close-fill);border-color:var(--close)}
.o-fp{color:var(--fp);background:var(--fp-fill);border-color:var(--fp)}
.o-lowinfo{color:var(--low);background:var(--low-fill);border-color:var(--low)}
.chip{display:inline-block;border:1px solid;border-radius:calc(.5lh + 1px);padding:0 8px;font-weight:650;font-size:12px}
.compare{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:0;font-size:13.5px}
.compare dt{color:var(--muted)}.compare dd{margin:0;overflow-wrap:anywhere}
/* On a phone each label goes above its value, so the value gets the card's whole width. */
@container (max-width:600px){.compare{grid-template-columns:minmax(0,1fr);gap:0}.compare dd{margin-bottom:8px}}
.rules{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.rules summary{cursor:pointer;color:var(--ink);font-weight:600}
.settings{font-size:13.5px;color:var(--muted);padding-block:10px 0}
.settings summary{cursor:pointer;color:var(--ink);font-weight:600}
.settings .controls{margin-top:10px}
.rules ol{padding-left:20px;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.rules b{color:var(--ink)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.kcur{fill:var(--ink)}
#isoGlow[aria-pressed="true"],#gapGlow.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* Highlight gaps' window opens under its button, over the cards and under the plot that stays in view above them. */
.gapsel{position:relative;display:flex}
.gapmenu{position:absolute;z-index:2;top:calc(100% + 4px);left:0;display:flex;flex-direction:column;gap:2px;padding:6px 10px;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);white-space:nowrap}
.gapmenu label{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--ink);padding:3px 2px;cursor:pointer}
.term{white-space:nowrap}
.qmark{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:3px;padding:0;border-radius:50%;
  border:1.5px solid var(--line-strong);background:var(--surface);color:var(--muted);font-size:11px;font-weight:700;
  line-height:1;vertical-align:3px}
.qmark:hover,.qmark[aria-expanded="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.gloss{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-start;padding:12px 14px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--line)}
.gloss-text{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.gloss-text p{margin:0;font-size:14px}
.gloss-title{font-weight:700}
.gloss-gif{margin:0;flex:0 1 240px;display:flex;flex-direction:column;gap:4px;min-width:0}
.gloss-gif img{display:block;max-width:100%;height:auto;border-radius:8px}
.gloss-gif figcaption{font-size:11.5px;color:var(--faint)}
.gloss-gif [data-gifhide]{align-self:flex-start}
.info{margin-top:12px;padding:14px 16px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);
  font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.info h2{font-size:15px}
.info p,.info ul{margin:0}.info ul{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.info pre{margin:0;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);
  font-family:var(--mono);font-size:12px;line-height:1.45;overflow-x:auto}
.info code{font-family:var(--mono);font-size:12.5px}
.info textarea{width:100%;font-family:var(--mono);font-size:12px}
/* The foot of the page: the version and the way to tell its author what would make it better. */
.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding-top:12px;
  border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
/* One dialog for every note to the author, a message saved as a text file. Its width is divided by the page's zoom,
   which multiplies it again, so a phone keeps a 16px gutter each side (2026-10-30 verification: 514.5px at 375px). */
dialog.note{width:min(560px,calc((100vw - 32px) / var(--page-zoom)));max-width:none;box-sizing:border-box;padding:18px 20px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);font-size:13.5px}
dialog.note::backdrop{background:rgba(16,24,40,.4)}
dialog.note h2{font-size:16px;margin:0 0 10px}
dialog.note label{display:block;margin-bottom:6px;color:var(--muted)}
dialog.note textarea{display:block;width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;
  background:var(--surface-2);color:var(--ink);font:inherit}
dialog.note #noteCopy{margin-top:10px;font-family:var(--mono);font-size:12px}
dialog.note .note-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
dialog.note p{margin:10px 0 0}
/* The peak under the pointer, its partner across the same bond, and the residues they read. */
.hov{stroke:var(--ink);stroke-opacity:.22;stroke-width:10;stroke-linecap:round;pointer-events:none}
/* An ion a drop-down list is on pulses and glows, as the one a press would pick; its partner across the bond is lit
   steadily beside it (2026-10-30). */
.hov.browse{stroke:var(--glow);stroke-opacity:.9;filter:drop-shadow(0 0 4px var(--glow));animation:shine 1.1s ease-in-out infinite}
.hov.partner{stroke:var(--glow);stroke-opacity:.45}
.hovres{fill:var(--ink);fill-opacity:.14;stroke:var(--ink);stroke-opacity:.6;stroke-width:1;pointer-events:none}
/* A model pointer's letters on the sequence, in the model's colour. */
.evres{fill:var(--model);fill-opacity:.2;stroke:var(--model);stroke-width:1.5;stroke-dasharray:3 2;pointer-events:none}
@media (prefers-reduced-motion:reduce){.track,.viewport{transition:none}.flash{animation:none}.halo,.rglow{animation:none;opacity:.6}.rpulse{display:none}.kpline{animation:none}.hov.browse{animation:none}}
</style>

# The answers

The card's two buttons. The page gives an answer in these words wherever it repeats one:
in the words that open the statement, in "You said", on the path above the cards and in
the replies.

## answer.yes
Yes

## answer.no
No

# The prompt under the answers

Shown under the answers on major gaps after a Yes, and on no other question.

## answer.prompt.letters
Select the amino acids on the peptide sequence that indicate a major gap in the coverage

# The words that open the statement

`{answer}` is the answer given. They are the same on every question: on coverage each
statement names the series it is about.

## answer.because
{answer}, because

# The count beside them

On major gaps after a Yes, the `{n}` letters picked. On unannotated ions, extra peaks and
peaks beyond the end after "In some of them", `{picked}` of the `{n}` marked peaks. On the
others the `{peaks}` and `{regions}` marked. Gap explanations, and major gaps after a No,
show none.

## answer.count.letters
{n} {n|amino acid|amino acids} selected

## answer.count.letters.none
no amino acid selected yet

## answer.count.picked
{picked} of the {n} marked {n|peak|peaks} picked

## answer.count.marks
{peaks} {peaks|peak|peaks} and {regions} {regions|region|regions} marked

## answer.count.none
nothing marked yet

# The buttons that mark every peak of a kind

The count entry is each button's tooltip, with `{n}` peaks of that kind. The unannotated
ions are those the model sees, at or above the threshold and not isotopes, and on the
unannotated-ions question theirs is the only button. The last button is on peaks in the
gaps.

## answer.group.b
Select all b ions

## answer.group.y
Select all y ions

## answer.group.u
Select all unannotated ions

## answer.group.pu
Select all unannotated peaks

## answer.group.count
{n} {n|peak|peaks}

# The top ions, on prominent ions

The first step after the answer. Each button marks the `{n}` most intense y, or b, ions at
or above the threshold, three as the model's rule counts them. Its tooltip is the count entry
under the lists below, or, when there is none to mark and the button is disabled, the none
entry, `{series}` being y or b and `{pct}` the threshold.

## answer.top.y
Select top {n} y ions

## answer.top.b
Select top {n} b ions

## answer.top.none
No {series} ion is at or above the threshold of {pct}%

# The lists to pick ions from

On prominent ions each button opens its list, shown once a top button is pressed or a peak
marked, which screen readers name as the button reads, and the count entry is the button's
tooltip, with `{n}` ions in the list. On peaks in the gaps the list of unannotated peaks is
open from the answer on, and the last entry is its name for screen readers. The other ions'
list holds every explained peak at or above the threshold that is not a b or y ion: the
precursor, its M+1 to M+3 isotopes among it, immonium ions, internal fragments, a ions,
losses and reporter ions. Any other isotope goes with its parent, so it is in no list.

## answer.list.b
Select specific b ions

## answer.list.y
Select specific y ions

## answer.list.u
Select specific unannotated ions

## answer.list.o
Select specific other ions

## answer.list.count
{n} {n|ion|ions}

## answer.list.unannotated
Unannotated peaks

# How the lists name a peak

An unannotated peak is named by `{n}`, its place among the unannotated peaks counted from
the lowest m/z, and a peak with no name of its own by its `{mz}`. Beside the name the lists
give the peak's m/z and `{share}`, its share of the base peak, or the share alone when the
name is the m/z. The statements, and on prominent ions the plot, name a peak the same way.

## answer.peak.unannotated
unannotated{n}

## answer.peak.mz
m/z {mz}

## answer.peak.line
m/z {mz} · {share}

# Coverage

The coverage question's statements, said of the marked b ions and of the marked y ions,
one decision each, so each names its own series. The buttons start them with a capital
letter, after the opening words; the reply repeats them as they stand. `{series}` is b or y,
and `{pct}` the Nearly complete setting. The second is not offered when Nearly complete is
set at 100%. These are the strict, stricter and strictest readings' statements.

## answer.series.none
the marked {series} ions have no gaps between them

## answer.series.few
the marked {series} ions have gaps, but cover {pct}% or more of the bonds

## answer.series.many
the marked {series} ions have too many gaps: they cover less than {pct}% of the bonds

# Coverage under the Paper reading

In a peptide ending in K or R, or starting with K, R or H instead, the card shows the b and
the y ions' lists, and a person ticks two ends in each: in the run series, b normally and y
when swapped, its first and last ion, and in the carrying series, y normally and b when
swapped, where its ions start and end. The ends entries stand under each list: `{lo}` and
`{hi}` the lowest and the highest ion ticked, the many entry when more than two are, the one
entry while a single ion is, `{lo}` being it, and the none entry before any. A list has its
ends once two ions on different bonds are ticked, or all it holds where it holds fewer, or,
in the run series, its first ion alone, b2 or y2 or b1 after an N-terminal modification,
told by the start entry: a run of that one ion. Once
both lists have their ends, each series is offered one pair of
statements, worded from them: the run pair, `{start}` being b2 or y2, or b1 after an
N-terminal modification, `{meet}` the carrying series' ion where the run must meet it and
`{other}` the carrying series; and the share pair, `{pct}` the Nearly complete setting. A
statement opening on an ion's name keeps its small letter on the button. The none entries
word a series the spectrum has no ion of, which has nothing to tick.

## answer.paper.ends
{lo} to {hi}

## answer.paper.ends.many
{lo} to {hi}: the lowest and highest ticked are the ends

## answer.paper.ends.none
tick its first and last ion

## answer.paper.ends.one
{lo} ticked: tick the other end too

## answer.paper.ends.start
{lo} alone, a run of its first ion

## answer.paper.run.meets
{lo} to {hi} run unbroken and meet {meet}

## answer.paper.run.breaks
{lo} to {hi} do not run unbroken from {start} to meet the {other} ions

## answer.paper.run.meets.none
the {series} ions run unbroken from {start} to meet the {other} ions

## answer.paper.run.breaks.none
the {series} ions do not run unbroken from {start} to meet the {other} ions

## answer.paper.share.reach
the {series} ions from {lo} to {hi} cover nearly all bonds: {pct}% or more

## answer.paper.share.short
the {series} ions from {lo} to {hi} have too many gaps: under {pct}%

## answer.paper.share.reach.none
the {series} ions cover nearly all bonds: {pct}% or more

## answer.paper.share.short.none
the {series} ions have too many gaps: under {pct}%

# Some or all of the marked peaks

On unannotated ions, extra peaks and peaks beyond the end, where "In some of them" opens a
list of the marked peaks to pick from. The last entry is that list's name for screen
readers.

## answer.quant.some
In some of them

## answer.quant.all
In all of them

## answer.picks.label
The marked peaks the statement is about

# Where the unannotated ions lie

The one statement on unannotated ions, after a Yes, about the marked ions or those picked
from the list.

## answer.between
These ions are in the gaps between annotated ions, with a mass defect between theirs

# How strong the signal is, on extra peaks and peaks beyond the end

The one statement each of them ends on, as no button or click marks a peak under the
threshold. `{pct}` is the base peak threshold.

## answer.picks.strong
Signal is at or above the selected threshold of {pct}%

# Peaks in the gaps

After a Yes. The first entry stands in for the list when no unannotated peak clears the
threshold, and `{pct}` is the prominent line.

## answer.unannot.none
No unannotated peak clears the threshold.

## answer.unannot.strong
Selected peaks are at or above the selected prominent threshold of {pct}%

## answer.unannot.weak
Selected peaks are lower than the selected prominent threshold of {pct}%

# Gap explanations

After a Yes, one or more of the reference model's own reasons are picked, so their words
are the model's, kept with its reasons.

# Major gaps

After a Yes the peptide's letters are buttons as well, and the first entry is their name
for screen readers. `{length}` is the major-gap length in force: the Major gap setting, or
the peptide's number of cleavages when it has fewer.

## answer.major.letters
Letters of the peptide

## answer.major.less
The longest run of cleavages with no b or y ion is less than {length}

## answer.major.more
The longest run of cleavages with no b or y ion is {length} or more

# Prominent ions

Two rows for each chosen ion, the second shown once the first is answered. The first is the
one residue the ion indicates, or none of them. The second is its explanation: the known
explanations that can apply to that ion and that residue, worded by the model's own entries
under "What explains an ion" in model.md, starting with a capital, and its none entry, "No
known explanation", always last.

## answer.ion.proline
Indicates proline (P)

## answer.ion.lysine
Indicates lysine (K)

## answer.ion.arginine
Indicates arginine (R)

## answer.ion.none
Indicates none of these

# Marks no statement fits

On unannotated ions, prominent ions, extra peaks, peaks beyond the end and peaks in the
gaps, after an answer that asks for a statement, regions marked alone are sent as they are,
with one of these beside Submit answer: the second on prominent ions, the first on the
others. Coverage waits for a statement for each series whatever is marked.

## answer.marks.peaks
The sentence here is about marked peaks, so your regions are judged as they are.

## answer.marks.ions
The statements here are about marked ions, so your regions are judged as they are.

# Submit answer

The button that ends every question and sends the answer, Yes or No. Until the statement
is complete it is disabled, and one of the entries after it stands beside it, saying what
is still missing: on unannotated ions, extra peaks and peaks beyond the end a peak to
mark, then some or all of them, then after In some of them a peak to tick; on peaks in
the gaps a peak to tick; on prominent ions an ion to tick, then every row of each; on
coverage the marks of a series, whose row of statements they open, then a statement for
it, `{series}` being b or y; on gap explanations a reason; on major gaps after a Yes an
amino acid; and the statement itself wherever one ends the question. Where a No is the
whole answer the button stands alone, except on extra peaks, where a No is the final
answer: pressing it sends the step and shows the verdict, with no button to press.

## answer.submit
Submit answer

## answer.missing.mark
Mark at least one peak

## answer.missing.quant
Choose in some or in all of them

## answer.missing.tick.peak
Tick at least one peak

## answer.missing.tick.ion
Tick at least one ion

## answer.missing.rows
Answer every row for each chosen ion first

## answer.missing.series.mark
Mark the {series} ions

## answer.missing.series.mark.both
Mark the b and the y ions

## answer.missing.series.ends
Tick the first and last {series} ion

## answer.missing.series.ends.both
Tick the first and last b ion and y ion

## answer.missing.series
Choose a statement for the {series} ions

## answer.missing.series.both
Choose a statement for the b ions and for the y ions

## answer.missing.reason
Choose at least one reason

## answer.missing.letter
Select at least one amino acid

## answer.missing.statement
Choose a statement

# What you said

The line above the reply. `{answer}` is the answer given, and `{statement}` the statement
in the words below, which the exported table's statements column holds as well.

## answer.said
You said: {answer}, because {statement}.

# The statements, repeated

The joining entry adds `{b}` to `{a}`: the y ions' statement to the b ions', and each gap
explanation picked to the ones before it. On coverage the two statements, so joined, are
the whole of what you said.

## answer.said.and
{a}; and {b}

# Gap explanations and major gaps, repeated

`{reasons}` are the reasons picked, each from a small letter, joined. `{length}` is the
major-gap length in force.

## answer.said.explained
the gaps are explained: {reasons}

## answer.said.major.less
the longest run of cleavages with no b or y ion is less than {length}

## answer.said.major.more
the longest run of cleavages with no b or y ion is {length} or more

# Where the unannotated ions lie, repeated

All `{n}` marked ions, or `{k}` of them picked from the list, named in `{names}`.

## answer.said.between.all
the {n} marked {n|ion is|ions are} in the gaps between annotated ions, with a mass defect between theirs

## answer.said.between.some
{k} of the {n} marked {n|ion|ions}, {names}, {k|is|are} in the gaps between annotated ions, with a mass defect between theirs

# The signal statements, repeated

`{which}` is one of the first two entries: all of the `{n}` marked peaks, or `{k}` of them
picked from the list, named in `{names}`. The picks entry is said on extra peaks and peaks
beyond the end, with `{pct}` the base peak threshold, and the unannot entries on peaks in
the gaps, with `{pct}` the prominent line.

## answer.said.all
in all of the {n} marked {n|peak|peaks}

## answer.said.picks.some
in {k} of the {n} marked peaks, {names},

## answer.said.picks.strong
{which} the signal is at or above the selected threshold of {pct}%

## answer.said.unannot.strong
the selected peaks are at or above the selected prominent threshold of {pct}%

## answer.said.unannot.weak
the selected peaks are lower than the selected prominent threshold of {pct}%

# Prominent ions, repeated

Each chosen ion's statement, one after another with semicolons. `{ion}` is its name,
`{residue}` the letter picked, or the none entry, and `{explanation}` the explanation

# Terms in the questions

A question's ? sits on its phrase, which the page looks for in the question's own words
in questions.md, so the phrase must match them exactly, capitals included: reword one
and reword the other, or the ? goes. Each explanation is a title and one or more
paragraphs: a blank line starts a new one, and a line broken without one runs on.

The explanations are in the style Rytis set in the lines entry below: one short paragraph
for each idea, opening on its name in bold, then the label the page shows it under in
italics in brackets where it has another, then " - " and a sentence or two. The word that
carries the decision is bold, and the page's names and labels and the ion series letters
are italic.

`{rule}`
is the coverage reading's rule at the Nearly complete setting, and `{reading}` the
reading's name in lower case, both from questions.md. `{n}` is the Major gap setting.

## glossary.defect.phrase
appropriate mass defect

## glossary.defect.title
Appropriate mass defect

## glossary.defect.body
**Mass defect** - how far an ion's exact mass sits from its nominal mass, the whole number
of its protons and neutrons. A peptide fragment's grows with its mass, by every residue it
holds, so the ions after a gap carry a larger defect than the ions before it.

**Gap** - a run of bonds that the *b* ions, or the *y* ions, do not cover between two bonds
they do: each series is looked at apart, and the gap lies between the m/z of its two
**flanking** ions, read at each charge the model fragments at.

**Appropriate mass defect** - as the paper's criterion (iii) has it, an unannotated peak in
a gap whose mass defect lies **between** those of the two flanking ions, each end widened by
the fragment tolerance. It could be a fragment of a slightly different peptide; one outside
that range is more likely noise or a contaminant.

## glossary.good.phrase
good explanations

## glossary.good.title
Good explanations

## glossary.good.body
**Prominent ions** - every peak at or **above** the prominent line. The answer is *Yes*
when **both** of the next two hold, as the paper's criteria ask.

**No prominent unannotated peak** - **every** prominent peak is an annotated ion: a *b*,
*y* or *a* ion or a neutral loss, an internal fragment, an immonium ion or a TMT reporter,
the precursor, or an isotope of any of these.

**Proline ions stand out** - in a tryptic-like peptide, one ending in K or R, the *y* ion
that starts at each proline after the first residue is **more intense** than each of its
neighbouring *y* ions that is seen, the one a residue longer and the one a residue shorter.
A neighbour that itself starts at a proline is skipped, and a proline's *y* ion that falls
outside the recorded m/z range or within the precursor window is excused. In a peptide that
starts with K, R or H and does not end in K or R the paper swaps *b* for *y*: the *b* ion that
ends just before each proline must stand out among the *b* ions.

**b2 and a2** - strong *b2* and *a2* ions are expected in HCD, so they count **in favour**
of *Yes*, but are never required. On the card it is also a known explanation, for the *b2*
ion and the *a2* ion only.

The known explanations below are what the card asks you to say of each ion you pick.

**Proline** (*P*) - the bond just **before** a proline breaks unusually easily, so the *y*
ion that starts with P and its *b* partner are often among the strongest peaks. The bond
just after it rarely breaks, so a missing ion there is expected.

**Aspartate** (*D*) - the bond just **after** an aspartate breaks easily too.

**C-terminal K or R** - trypsin cuts **after** lysine (K) and arginine (R), so a tryptic
peptide ends in one, which holds the charge: **every** *y* ion of such a peptide is
expected to be strong. It is read from the peptide's own sequence, so a semi-tryptic
peptide that ends otherwise has **no** such explanation.

**Other explained ions** - an immonium ion, an internal fragment, one starting at a proline
among them, the unfragmented precursor, a TMT reporter ion, and an isotope peak, which goes
with its parent.

**No known explanation** - a *b* or *y* ion with none of these, and any unannotated peak.

**Highlight proline** - lights every P on the sequence and the ions that indicate it: those
from the bond just before it, such as the *y* ion that starts with P and its *b* partner,
an internal fragment that starts at P, and its immonium ion.

**Highlight lysine and arginine** - lights every K and R on the sequence and the ions that
indicate them: those from the bond just before the residue, such as the *y* ion that
starts with it and its *b* partner, and its immonium ion. A proline straight after a K or
R, where trypsin usually does not cut, is underlined in red.

## glossary.nearly.phrase
nearly complete coverage

## glossary.nearly.title
Nearly complete coverage

## glossary.nearly.body
**Coverage** - the share of the peptide's cleavages, the bonds between neighbouring amino
acids, that its *b* and *y* ions break.

**Nearly complete** - under the *{reading}* reading, {rule}. Set the reading under
*Coverage* in *Settings*, and the share under *Nearly complete from*.

**Tryptic pattern** (*Paper*, the default) - the paper's criterion (i): in a peptide ending
in K or R a **nearly complete** *y* series and a *b* series that runs unbroken from *b2* up
to at least the first bond the *y* ions cover, so the two meet. *b* and *y* are swapped in a
peptide that starts with K, R or H instead, and in any other peptide *b* and *y* combined
must reach the share. *b1* is not needed, as it is seldom seen, unless the N terminus is
modified: then the *b* run starts at *b1*. An ion the record cannot hold, below its lowest
m/z or within the precursor window, counts as present in the run. On the card you tick each
series' two ends from its list, and its statements are about the ions seen between them.

**Gaps between the marked ions** - bonds between the first and the last bond a series'
marked ions cover that **none** of them covers. A missing *b1* before the first marked *b*
ion is not one.

## glossary.major.phrase
major gaps

## glossary.major.title
Major gaps

## glossary.major.body
**Gap** - a run of consecutive cleavages with **no** *b* or *y* ion, each drawn on the
sequence as a dashed red line the height of the letters. A cleavage missing only its *b*
or only its *y* ion gets half the line, *b* below and *y* above.

**Major gap** - a gap of {n} {n|cleavage|cleavages} or more, the number set under *Major
gap from* in *Settings*, even one that reaches an end of the peptide. In a peptide with
fewer cleavages than that, only a gap over **every** cleavage is major.

**Picking a gap's letters** - after *Yes*, pick any letter from the one before a major
gap's first missing cleavage to the one after its last, the stretch the spectrum confirms
only by its total mass. A letter outside every major gap keeps the model from agreeing.

# Terms beside the settings

The first opens from the ? beside the base peak threshold and from the one beside the
prominent line, the second from the one beside the fragment tolerance.

## glossary.lines.title
Base peak threshold and the prominent line

## glossary.lines.body
**Base peak threshold** (*threshold*) - the signal **below** it is considered as background noise. The tallest peak in the spectrum is automatically set to 100% base peak.

**Prominent threshold** (*prominent*) - a peak **above** it counts as prominent: one unannotated peak there is enough for *extra peaks*, and *peaks in the gaps* looks only at peaks above it. Often one of the most prominent ions is a *y* ion that begins at a proline (P).

## glossary.tolerance.title
Fragment tolerance

## glossary.tolerance.body
**Fragment tolerance** - how far a peak's measured m/z may sit from an ion's calculated m/z
and still match it. Use what the search used: MSFragger's default for high-resolution
spectra is 20 ppm.

**ppm** or **Da** - in ppm, parts per million, the window grows with m/z: 20 ppm is 0.01
either side at m/z 500 and 0.02 at m/z 1,000. In Da it is the same width everywhere.

# Terms in the legend

The first opens from the ? beside other explained ion, the second from the one beside
unannotated.

## glossary.other.title
Other explained ions

## glossary.other.body
**Other explained ions** - peaks the model matches to something other than a *b* or *y*
ion of the peptide. They count as explained, so they **never** count as extra peaks, though
only *b* and *y* ions count toward coverage.

**Families** - *a* ions, water and ammonia losses, phosphate loss from phosphoserine and
phosphothreonine, CH₃SOH loss from oxidised methionine, the precursor, immonium ions, TMT
reporter ions of a tagged peptide, internal fragments, and the 13C isotopes of all of
these. The M+1 to M+3 isotopes of the precursor and of its losses are matched as the
precursor itself, so a residual precursor's envelope is explained even where its first
peak is not seen.

**Isotopes** - the 13C isotope peaks of a *b* or *y* ion are drawn faded in that ion's
colour. *Highlight isotopes* lights every isotope peak.

## glossary.unannotated.title
Unannotated peaks

## glossary.unannotated.body
**Unannotated peaks** (*unannotated*) - peaks at or **above** the base peak threshold that
match no ion the model tries within the fragment tolerance. A peak's isotopes go with it,
so it is counted once.

**Where they can come from** - a second peptide in the isolation window, a modification
the search did not consider, or a fragment type the model does not try: unannotated is
**not** the same as noise.

# The reference model's reasons

What the reference model says with each answer: its reason, and the notes on its evidence,
numbered in the reply and on the plot. The model fills in the values in braces. It writes
ion names such as y6, b5²⁺ or imm P itself, and names a residue by its letter and its place
in the peptide, such as P6. `{mz}` is an m/z value and `{rel}` a peak's share of the base
peak, both as the model prints them.

Pieces many of the reasons below share. The first names an ion and where it lies; the
second adds why the ion is expected, the entries under "What explains an ion". The
third names the two residues either side of a bond, as in "P6 and Q7", and is the `{bond}`
of the entries that follow.

# Coverage (q1)

The answer opens on the settings, `{threshold}` and `{nearly}`, then gives two numbered lists,
each under its heading entry: the covered entries, then the uncovered ones. It ends on the
verdict. On the page the lists nest in a numbered list of the two headings; in plain text they
run on in one line. `{b}` and `{y}` count the cleavages each series covers alone, `{all}` those
b and y combined cover, a line said only under the Strict reading, and `{notb}` and `{noty}`
those each series misses; each value ending in `share` is the share of the cleavages its count
holds. `{rule}` is the rule entry, with the reading's name and short name from questions.md,
and `{verdict}` one of the two verdict entries. On a Yes the evidence is each b or y ion, as the
ion entry names it; on a No, the gaps of each series that falls short.

# The paper's reading (q1)

Under the Paper reading two paragraphs come before the verdict: the case entry the peptide's
ends make, `{residue}` being its last residue for tryptic and its first for swapped, and,
in a tryptic-like or swapped peptide, one run entry. `{series}` is the series that must run
unbroken, b or y, from `{start}`, b2 or y2, or b1 where the N terminus is modified, `{carry}` the series that must reach `{pct}`%,
`{to}` the ion the run reaches and `{need}` the ion it must reach to meet the carrying series,
the one at the first bond that series covers, and `{where}` that bond in words, the where.start
entry for a tryptic-like peptide and where.end for a swapped one, whose b ions the run meets
at their last bond. The at entries are for a run whose own first ion, `{start}`, is already
at that bond. The modified entry replaces the tryptic one
when the N terminus itself carries a mass modification, on the terminus or as a pyro form of
residue 1 (pyro-glu from Q or E, pyro-carbamidomethyl C), as the paper's criterion (vi) then
expects b1. A side-chain modification of residue 1, such as an oxidised M, does not count.

## model.q1.case.swapped

# Unannotated ions in gaps (q2)

After the paper's criterion (iii). A gap is a run of bonds that one series' ions, b or y,
do not cover between two bonds they do; the gap entry names it, `{series}` being b or y and
`{lo}` and `{hi}` its two flanking ions, the lighter and the heavier. A peak is in a gap when
its m/z lies strictly between the flanking ions' m/z at a charge the model fragments at, and
a candidate when its mass defect also lies between theirs. `{mz}` is the peak's m/z,
`{lomz}` and `{himz}` the flanking ions' m/z at that charge, `{charge}` the charge, and
`{defect}`, `{lodefect}` and `{hidefect}` the mass defects of the peak and of the two
flanking ions, each read as a singly protonated mass at that charge, in Da with their sign.
On a No each unannotated peak is shown: one in a gap by the no note, any other by the out
note. The stretch entry names a range of m/z, `{lo}` to `{hi}`, wherever one is written out.

# The isobaric caution

Some residue pairs weigh what one residue does, GG and N, AG or GA and Q, found from the
residue masses within 0.002 Da, the peptide's modified residues included; where every C in
the peptide carries +57.0215, carbamidomethyl C is taken as fixed, and no pair holding an
unmodified C is offered. The pair entry is for two neighbouring residues that weigh one,
`{left}` and `{right}` with their places, `{pair}` the two letters and `{one}` the residue
they could be, when the bond between them has no b or y ion. The one entry is for a residue
that weighs a pair, `{residue}` with its place and `{name}` its letter, when the ion the
pair `{pair}` would make at the bond between its two residues is an unannotated peak at or
above the threshold: `{ion}` is that ion, numbered in the peptide the pair would make, and
`{mz}` the peak's m/z. Pairs whose ion lands on one peak share one entry, their names and
ions each joined by the or entry. The line entry joins them, `{cautions}` separated by semicolons. It
changes no answer and no verdict.

# How the reference model decides

The panel that opens under the cards from "How the reference model decides", in the
order it shows them: a short introduction, one line for each question, then how the model
agrees, its reply's colours and the controls, how it judges your statements and what the
marks on the sequence mean. Each entry is a paragraph of the panel, and a blank line inside
one starts another paragraph, except in the numbered list, where each entry is one item
however its lines are broken. The paragraphs are in the style of the glossary's
explanations: a name in bold, " - " and a sentence or two.

`{threshold}` is the Base peak threshold setting, and `{tol} {unit}` the Fragment
tolerance with its unit, such as 20 ppm. `{citation}` is the paper, page.citation in
interface.md.

## rules.model
**Source** - the flowchart is adapted from {citation}. The rules below are this tool's own
interpretation of it, not the paper's.

**Reference model** - a set of rules, not a trained network. It sees only the peaks at or
**above** {threshold}% of the base peak, and matches them within {tol} {unit} to the
peptide's *b* and *y* ions and to the *other explained ions*.

**Isobaric caution** - a note on the verdict, never an answer: two neighbouring residues
that weigh one, such as GG and N, with no ion between them; or one residue that weighs a
pair, where an unannotated peak sits at the ion the pair would make between its residues.
That second kind fires about **half** the time by chance: on the seven real sets checked on
2026-10-30 it fired 484 times in 24,476 residue and pair tests, against a mean of 250.5 when
the same ions were shifted by 5 to 13 Da either way.

# The rules, one for each question

The numbered list, in the order the flowchart asks the questions, each item the question's
short name and its rule in one sentence.

`{rule}` is the coverage reading's rule at the Nearly complete setting, and `{reading}` the
reading's name in lower case, both from questions.md. `{share}` is the share of the intensity above the threshold
that makes extra peaks, `{n}` the Major gap setting and `{length}` one more than it, and
`{window}` the m/z either side of the precursor where fragments are swamped or isolated away.

## rules.coverage
**Coverage** - *Yes* when {rule}, under the *{reading}* reading.

## rules.unannotated
**Unannotated ions** - *Yes* when an unannotated peak lies in a gap of the *b* ions or of
the *y* ions, strictly between the two flanking ions of that series, with a mass defect
**between** theirs, each end widened by the fragment tolerance, read at each charge the model
fragments at.

## rules.prominent
**Prominent ions** - *Yes* when **no** peak at or above the prominent line is unannotated,
an ion's isotopes going with it, and, in a peptide ending in K or R, the *y* ion that starts
at each proline after the first residue is **more intense** than each neighbouring *y* ion
seen that does not itself start at a proline, and in one starting with K, R or H instead the
*b* ion that ends just before each proline likewise among the *b* ions, *b2* and *a2* ions
counting in favour but never required.

## rules.extra
**Extra peaks** - *Yes* when unannotated peaks carry {share} or more of the intensity above
the threshold, or **any** one of them reaches the prominent threshold. A *No* here is your
final answer: it is sent as you press it, and the verdict shows at once.

## rules.major
**Major gaps** - *Yes* when {n} or more consecutive cleavages have **no** *b* or *y* ion,
or, in a peptide shorter than {length} residues, every cleavage has none.

## rules.explanations
**Gap explanations** - *Yes* when **every** missing cleavage follows a proline, is the
first bond with no proline at residue 2 and no N-terminal modification, or has all its ions below the lowest recorded m/z
or within {window} m/z of the precursor. There is no *y1* counterpart: b1 is rarely seen
because of b1's own instability, and the paper's (vi) is about that ion, not a rule of the
tryptic-like pattern to mirror at the C terminus.

## rules.beyond
**Peaks beyond the end** - *Yes* when an unannotated peak at or above the threshold,
prominent or **not**, lies above the last annotated *b* or *y* ion.

## rules.ingaps
**Peaks in the gaps** - *Yes* when a **prominent** unannotated peak lies where the missing
*b* or *y* ions of a major gap would fall, or of any gap when none is major.

# How it agrees with you

`{share}` is the share of the weight of the model's evidence that your marks must cover.

## rules.agree
**Agreement** - the model agrees when your answer is its answer and your marks cover at
least {share} of the weight of its evidence, peaks weighted by intensity. Some of its
evidence, such as that for a No to a question asking whether there are any, is shown but
**never** required.

**Pointing at a gap** - drag across the region of the spectrum where its missing ions
would fall, as an annotated ion beside a gap shows coverage, **not** the gap. On major gaps
pick its letters on the sequence instead; a letter outside every major gap keeps the model
from agreeing.

## rules.reply
**Reply** - green when the model agrees, yellow when it gives your answer but your marks or
your statement fall short, and red when its answer differs.

# Controls

`{n}` is the number of controls each spectrum is set beside.

## rules.controls
**Controls** - PSMs you trust, loaded with *Load controls*. In a complex lysate the model
calls many known-real PSMs false at low scores, so each spectrum is set beside the {n}
controls nearest it in hyperscore, and the reply and the verdict say how often the model
gives them the same answer.

# How it judges your statements

`{top}` is the number of ions each *Select top* button marks.

## rules.statements
**Statements** - after *because*, most questions build a sentence, and the model checks it
against the spectrum. It must be **true**, and must not argue for the other answer or leave
the answer undecided, or the model does not agree.

**Coverage statements** - one for the marked *b* ions and one for the marked *y* ions: they
have **no** gaps between them, have gaps but cover the *Nearly complete from* share of the
bonds, or have too many gaps.

**Paper reading** - in a peptide ending in K or R you tick two ends in each list: the first
and last *b* ion of the run, and where the *y* ions start and end; with more than two ticked,
the lowest and highest are the ends. One ion ticked is not two ends, unless it is the run's
first ion alone, a run of that one ion. Then each series has one pair of statements, worded from
its ends. The *b* run meets when every *b* ion between its ends is seen, or falls where the
record cannot hold it, it starts at *b2*, or *b1* after an N-terminal modification, and its
last bond reaches the first bond the *y* ions cover; it breaks when the *b* ions seen do not
make that run toward every *y* ion seen. The *y* share reaches the line when the *y* ions seen between their ends cover
the *Nearly complete from* share of all bonds or more, gaps allowed; it falls short when every
*y* ion seen, whatever the ends, covers less. A *Yes* needs both met;
either failing is a *No* by itself, so a *No* may state that one alone. In a peptide starting
with K, R or H instead *b* and *y* swap, the *y* run starting at *y2*, and in any other the
statements are judged as under the *strict* reading.

**Coverage readings** - under the *strictest* reading a *Yes* needs **both** series to
reach that share and a *No* one with too many gaps, and under the *stricter* reading a *Yes*
needs either and a *No* both. Under the *strict* reading a series that reaches it argues for
*Yes*, and otherwise the model's count of the two together decides.

**Marked peaks** - on unannotated ions, extra peaks and peaks beyond the end, the sentence
is about the marked peaks, all of them or some picked from a list: that they are unannotated
ions in the gaps between annotated ions, by the same test as the unannotated-ions rule, or
that their signal is at or above the threshold.

**Peaks in the gaps** - you say the picked peaks are all at or above the prominent
threshold, which argues for *Yes*, or all lower, which argues for *No*.

**Gap explanations** - true when **every** missing cleavage has one of the reasons picked,
and every reason picked explains one.

**Major gaps** - you say the longest run of cleavages with no *b* or *y* ion is under the
major-gap length, which argues for *No*, or that length or more, which argues for *Yes*.

## rules.statements.prominent
**Prominent ions** - pick ions, the top {top} *y* or *b* ions or any from the lists, and say
for each the **one** residue of P, K and R it indicates, or none, and its explanation, picked
from the known explanations that can apply to it.

**Indicates** - an ion indicates a P, K or R when it comes from the bond just **before**
that residue, as the *y* ion starting with it and its *b* partner do, or is its immonium
ion; an internal fragment that starts at a P indicates P. *Highlight proline* and
*Highlight lysine and arginine* light the same ions.

**Explanation** - true when the model gives that ion that explanation, and *No known
explanation* true when it gives none.

# What the sequence shows

## rules.sequence
**Hooks** - a *b* ion hangs a hook **below** the letters at its bond and a *y* ion raises
one above, each numbered as its ion. A *b* or *y* ion at or above the prominent threshold
lights its hook and the half of its letter on its own side.

**Gap lines** - a dashed red line at a bond **no** *b* or *y* ion breaks, or half of one
where only the *b* ion, below, or the *y* ion, above, is missing. On the gap explanations
question every gap glows as the card opens; unticking a kind under Highlight gaps puts it
out there, and your own choice comes back when you leave the card.

**Your marks** - purple: the hook of a marked ion, or of a *b* or *y* ion your region
spans, dashed where that bond's own *b* or *y* ion was not observed, and the half of the
letter where a marked ion breaks the peptide. An *a* ion or a loss only outlines that half,
as it does not count toward coverage, while internal fragments, immonium ions, precursors
and the letters you pick shade whole letters.

**Dots** - a dot under a letter marks a modified residue or end.

**Model's pointers** - drawn in ink and dashed, and numbered on the spectrum as in the
reply. A pointer about a gap outlines its letters on the sequence instead, and fills them
while you point at its line in the reply. Where the spectrum is too crowded to pin a
pointer so that its pin reads as its own, its number in the reply is hollow, and pressing
it still flashes the pointer.
